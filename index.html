<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Environmental Reports — Cal State LA</title>
<style>
:root{--black:#000000;--darkgray:#4A4F55;--gold:#FFCE00;--marigold:#FCB237;--golden:#A18528;--bg:#f0f2f7;--card:#fff;--border:#dde1e9;--muted:#6b7280}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);font-size:14px;color:#111827}
header{background:var(--black);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:14px;box-shadow:0 2px 6px rgba(0,0,0,.25);border-bottom:3px solid var(--gold)}
.brand{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;border-right:2px solid var(--gold);padding-right:12px}
.title{font-size:15px;font-weight:600}
.wrap{padding:12px 14px;max-width:1700px;margin:0 auto}
.top{display:flex;gap:10px;margin-bottom:10px;align-items:flex-start}
.fgrid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;flex:1;min-width:0}
.fc{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:9px 11px}
.fc-h{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--black);margin-bottom:7px;padding-bottom:5px;border-bottom:2px solid var(--gold)}
.cbl{max-height:182px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;scrollbar-width:thin;scrollbar-color:var(--golden) transparent}
.cbl::-webkit-scrollbar{width:4px}.cbl::-webkit-scrollbar-track{background:transparent}.cbl::-webkit-scrollbar-thumb{background:var(--golden);border-radius:2px}
.ygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;max-height:182px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--golden) transparent}
.ygrid::-webkit-scrollbar{width:4px}.ygrid::-webkit-scrollbar-track{background:transparent}.ygrid::-webkit-scrollbar-thumb{background:var(--golden);border-radius:2px}
.cbl label,.ygrid label{display:flex;align-items:center;gap:5px;cursor:pointer;padding:2px 4px;border-radius:3px;font-size:12px;white-space:nowrap}
.cbl label:hover,.ygrid label:hover{background:#fffbe6}
input[type=checkbox]{accent-color:var(--golden);cursor:pointer;flex-shrink:0}
.scol{display:flex;flex-direction:column;gap:8px;min-width:148px;flex-shrink:0}
.sc{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--gold);border-radius:6px;padding:12px 13px;text-align:center}
.scv{font-size:28px;font-weight:700;color:var(--black);line-height:1}
.scv.sm{font-size:14px}
.scl{font-size:10px;color:var(--muted);margin-top:4px}
.btn{padding:7px;background:var(--black);color:var(--gold);border:none;border-radius:5px;cursor:pointer;font-size:12px;font-weight:600;width:100%;transition:background .15s ease}
.btn:hover{background:var(--darkgray)}
.tc{background:var(--card);border:1px solid var(--border);border-radius:6px;overflow:hidden}
.ts{overflow-x:auto;max-height:calc(100vh - 340px);overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--golden) transparent}
.ts::-webkit-scrollbar{width:6px;height:6px}.ts::-webkit-scrollbar-track{background:transparent}.ts::-webkit-scrollbar-thumb{background:var(--golden);border-radius:3px}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:var(--black);color:#fff;padding:7px 9px;text-align:left;white-space:nowrap;position:sticky;top:0;z-index:2;cursor:pointer;user-select:none}
thead th:hover{background:var(--darkgray)}
.si{margin-left:3px;font-size:9px;opacity:.7}
tbody tr:nth-child(even){background:#f7f9fd}
tbody tr{transition:background .1s ease}
tbody tr:hover{background:#fffbe6}
tbody td{padding:7px 9px;border-bottom:1px solid var(--border);vertical-align:middle}
.tdt{max-width:310px;word-break:break-word;line-height:1.3}
.tdl a{color:var(--black);text-decoration:none;font-weight:600;padding:2px 7px;border:1px solid var(--black);border-radius:4px;white-space:nowrap;font-size:11px;transition:background .1s ease,color .1s ease}
.tdl a:hover{background:var(--black);color:var(--gold)}
tfoot td{padding:6px 9px;color:var(--muted);font-size:11px;border-top:2px solid var(--border);font-weight:600}
.sb{padding:4px 11px;font-size:10px;color:var(--muted);border-top:1px solid var(--border)}
.srow{padding:8px 11px;border-bottom:1px solid var(--border);position:relative;display:flex;align-items:center}
.srow svg{position:absolute;left:20px;width:14px;height:14px;opacity:.4;pointer-events:none}
.srch{padding:7px 10px 7px 34px;border:1px solid var(--border);border-radius:5px;font-size:13px;width:100%;background:var(--card);color:#111827;outline:none;transition:border-color .15s ease}
.srch:focus-visible{outline:2px solid var(--golden);outline-offset:1px;border-color:var(--golden)}
.badges{display:flex;flex-wrap:wrap;gap:4px;min-height:4px}
.badge{background:#fffbe6;border:1px solid var(--marigold);border-left:3px solid var(--golden);border-radius:3px;font-size:10px;padding:2px 6px;color:#111827;font-weight:600;white-space:nowrap}
.hpill{display:inline-block;padding:1px 7px;border-radius:3px;font-size:11px;font-weight:600;white-space:nowrap}
.h-asbestos{background:#fff0e0;color:#b45309}
.h-mold{background:#e6f4f0;color:#0f7460}
.h-lead{background:#fde8e8;color:#b91c1c}
.h-pcb{background:#ede9fe;color:#6d28d9}
.h-default{background:#f3f4f6;color:#374151}
.empty{padding:40px;text-align:center;color:var(--muted);font-size:13px}
.empty strong{display:block;font-size:15px;color:#374151;margin-bottom:4px}
@media(max-width:900px){.fgrid{grid-template-columns:1fr 1fr}.top{flex-direction:column}.scol{flex-direction:row;flex-wrap:wrap}.sc{flex:1;min-width:110px}}
</style>
</head>
<body>
<header>
  <span class="brand">Cal State LA</span>
  <span class="title">Environmental Reports Dashboard</span>
</header>
<div class="wrap">
  <div class="top">
    <div class="fgrid">
      <div class="fc"><div class="fc-h">Building</div><div class="cbl" id="fB"></div></div>
      <div class="fc"><div class="fc-h">Hazard</div><div class="cbl" id="fH"></div></div>
      <div class="fc"><div class="fc-h">Report Type</div><div class="cbl" id="fR"></div></div>
      <div class="fc"><div class="fc-h">Year</div><div class="ygrid" id="fY"></div></div>
    </div>
    <div class="scol">
      <div class="sc"><div class="scv" id="sC">—</div><div class="scl">Count of Reports</div></div>
      <div class="sc"><div class="scv sm" id="sL">—</div><div class="scl">Latest Report Date</div></div>
      <div class="badges" id="badges"></div>
      <button class="btn" onclick="clr()">Clear All Filters</button>
    </div>
  </div>
  <div class="tc">
    <div class="srow">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8.5" cy="8.5" r="5.5"/><line x1="13" y1="13" x2="18" y2="18"/></svg>
      <input type="search" id="srch" class="srch" placeholder="Search report titles or buildings…" oninput="rdr()">
    </div>
    <div class="ts">
      <table>
        <thead><tr>
          <th onclick="sb('t')">Report Title <span class="si" id="si-t">⇅</span></th>
          <th onclick="sb('_s')">Date <span class="si" id="si-_s">▼</span></th>
          <th onclick="sb('h')">Hazard <span class="si" id="si-h">⇅</span></th>
          <th onclick="sb('rt')">Report Type <span class="si" id="si-rt">⇅</span></th>
          <th onclick="sb('v')">Vendor <span class="si" id="si-v">⇅</span></th>
          <th>Report Link</th>
        </tr></thead>
        <tbody id="tB"></tbody>
        <tfoot><tr><td colspan="6" id="tF"></td></tr></tfoot>
      </table>
    </div>
    <div class="sb">Loading data…</div>
  </div>
</div>
<script>
const BASE='https://csula.sharepoint.com';
const MN=['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const HCLASS={asbestos:'h-asbestos',mold:'h-mold',lead:'h-lead',pcb:'h-pcb'};
function hcls(h){const k=(h||'').toLowerCase();for(const t in HCLASS)if(k.includes(t))return HCLASS[t];return'h-default';}
let ALL=[];
let sCol='_s',sDir='desc';

// Filters
function uniq(a){return[...new Set(a.filter(Boolean))]}
function fill(id,vals,g){
  document.getElementById(id).innerHTML=vals.map(v=>`<label><input type="checkbox" data-g="${g}" value="${x(String(v))}" onchange="rdr()">${x(String(v))}</label>`).join('');
}
function buildF(){
  fill('fB',uniq(ALL.map(r=>r.b)).sort(),'b');
  fill('fH',uniq(ALL.map(r=>r.h)).sort(),'h');
  fill('fR',uniq(ALL.map(r=>r.rt)).sort(),'r');
  fill('fY',uniq(ALL.map(r=>r.yr)).sort((a,b)=>b-a),'y');
}
function gsel(g){return[...document.querySelectorAll(`[data-g="${g}"]:checked`)].map(c=>c.value)}
function applyF(){
  const b=gsel('b'),h=gsel('h'),r=gsel('r'),y=gsel('y').map(Number);
  const q=(document.getElementById('srch')?.value||'').toLowerCase().trim();
  return ALL.filter(rec=>
    (!b.length||b.includes(rec.b))&&
    (!h.length||h.includes(rec.h))&&
    (!r.length||r.includes(rec.rt))&&
    (!y.length||y.includes(rec.yr))&&
    (!q||rec.t.toLowerCase().includes(q)||rec.b.toLowerCase().includes(q))
  );
}
function clr(){document.querySelectorAll('[data-g]').forEach(c=>c.checked=false);const s=document.getElementById('srch');if(s)s.value='';rdr()}

// Sort
function sb(col){
  if(sCol===col)sDir=sDir==='asc'?'desc':'asc';
  else{sCol=col;sDir=col==='_s'?'desc':'asc';}
  rdr();
}
function srt(recs){
  const d=sDir==='asc'?1:-1;
  return[...recs].sort((a,b)=>{
    const av=a[sCol]??'',bv=b[sCol]??'';
    return typeof av==='number'?(av-bv)*d:String(av).localeCompare(String(bv))*d;
  });
}
function updIcons(){
  ['t','_s','h','rt','v'].forEach(c=>{
    const el=document.getElementById('si-'+c);
    if(el)el.textContent=c===sCol?(sDir==='asc'?'▲':'▼'):'⇅';
  });
}

// Render
function rdr(){
  const f=applyF(),rows=srt(f);
  if(!rows.length){
    document.getElementById('tB').innerHTML=`<tr><td colspan="6" class="empty"><strong>No reports match your filters</strong>Try clearing some filters or adjusting your search</td></tr>`;
  } else {
    document.getElementById('tB').innerHTML=rows.map(r=>{
      const ds=r.mo&&r.dy&&r.yr?`${MN[r.mo]} ${r.dy}, ${r.yr}`:r.yr||'';
      return`<tr>
    <td class="tdt" title="${x(r.t)}">${x(r.t)}</td>
    <td style="white-space:nowrap">${ds}</td>
    <td><span class="hpill ${hcls(r.h)}">${x(r.h)}</span></td>
    <td>${x(r.rt)}</td>
    <td>${x(r.v)}</td>
    <td class="tdl"><a href="${x(r.url)}" target="_blank" rel="noopener">Open ↗</a></td>
  </tr>`;}).join('');
  }
  document.getElementById('tF').textContent=`Total  ${rows.length} record${rows.length!==1?'s':''}`;
  document.getElementById('sC').textContent=f.length;
  const lat=f.reduce((a,b)=>(!a||b._s>a._s)?b:a,null);
  document.getElementById('sL').textContent=lat?`${MN[lat.mo]} ${lat.dy}, ${lat.yr}`:'—';
  updIcons();
  updBadges();
}
function updBadges(){
  const grps=[{g:'b',l:'Building'},{g:'h',l:'Hazard'},{g:'r',l:'Type'},{g:'y',l:'Year'}];
  const q=(document.getElementById('srch')?.value||'').trim();
  let html='';
  grps.forEach(({g,l})=>gsel(g).forEach(v=>{html+=`<span class="badge">${l}: ${x(v)}</span>`;}));
  if(q)html+=`<span class="badge">Search: ${x(q)}</span>`;
  document.getElementById('badges').innerHTML=html;
}

function x(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

fetch('data.json')
  .then(r=>r.json())
  .then(data=>{
    ALL=data.records.map(r=>{
      const sv=v=>typeof v==='object'&&v!==null?(v.Value||v.value||''):v||'';
      const title=sv(r.ReportTitle)||r.Title||r.t||'';
      const link=sv(r.FileLink)||r.f||'';
      const hazard=sv(r.Hazard)||r.h||'';
      const rtype=sv(r.ReportType)||r.rt||'';
      const vendor=sv(r.Vendor)||r.v||'';
      const building=sv(r.BuildingFolderKey)||r.b||'';
      const dateStr=r.ReportDate||r.d||'';
      let mo=0,dy=0,yr=0;
      if(dateStr.includes('T')||dateStr.includes('-')){
        const dt=new Date(dateStr);mo=dt.getUTCMonth()+1;dy=dt.getUTCDate();yr=dt.getUTCFullYear();
      } else {const p=dateStr.split('/');mo=+p[0]||0;dy=+p[1]||0;yr=+p[2]||0;}
      const q=mo<=3?1:mo<=6?2:mo<=9?3:4;
      return{t:title,h:hazard,rt:rtype,v:vendor,b:building,f:link,mo,dy,yr,q,mn:MN[mo]||'',url:link.startsWith('http')?link:BASE+link,_s:yr*10000+mo*100+dy};
    });
    const upd=new Date(data.updated);
    const mon=upd.toLocaleString('en-US',{month:'long',timeZone:'UTC'});
    document.querySelector('.sb').textContent=
      ALL.length+' records   |   Data as of '+mon+' '+upd.getUTCFullYear()+'   |   Cal State LA Environmental Reports';
    buildF();
    rdr();
  })
  .catch(()=>{document.querySelector('.sb').textContent='Error loading data. Please refresh.';});
</script>
</body>
</html>
