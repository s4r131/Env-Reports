<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Environmental Reports — Cal State LA</title>
<style>
:root{--black:#000000;--darkgray:#4A4F55;--gold:#FFCE00;--marigold:#FCB237;--golden:#A18528;--bg:#f0f2f7;--card:#fff;--border:#dde1e9;--muted:#6b7280}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);font-size:13px;color:#111827}
header{background:var(--black);color:#fff;padding:9px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.brand{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;border-right:2px solid var(--gold);padding-right:12px}
.title{font-size:15px;font-weight:600}
.wrap{padding:12px 14px;max-width:1700px;margin:0 auto}
.top{display:flex;gap:10px;margin-bottom:10px;align-items:flex-start}
.fgrid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;flex:1;min-width:0}
.fc{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:9px 11px}
.fc-h{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--black);margin-bottom:7px;padding-bottom:5px;border-bottom:2px solid var(--gold)}
.cbl{max-height:182px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.ygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;max-height:182px;overflow-y:auto}
.cbl label,.ygrid label{display:flex;align-items:center;gap:5px;cursor:pointer;padding:2px 4px;border-radius:3px;font-size:12px;white-space:nowrap}
.cbl label:hover,.ygrid label:hover{background:#fffbe6}
input[type=checkbox]{accent-color:var(--golden);cursor:pointer;flex-shrink:0}
.scol{display:flex;flex-direction:column;gap:8px;min-width:148px;flex-shrink:0}
.sc{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:12px 13px;text-align:center}
.scv{font-size:28px;font-weight:700;color:var(--black);line-height:1}
.scv.sm{font-size:14px}
.scl{font-size:10px;color:var(--muted);margin-top:4px}
.btn{padding:7px;background:var(--black);color:var(--gold);border:none;border-radius:5px;cursor:pointer;font-size:12px;font-weight:600;width:100%}
.btn:hover{background:var(--darkgray)}
.tc{background:var(--card);border:1px solid var(--border);border-radius:6px;overflow:hidden}
.ts{overflow-x:auto;max-height:calc(100vh - 360px);overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{background:var(--black);color:#fff;padding:7px 9px;text-align:left;white-space:nowrap;position:sticky;top:0;z-index:2;cursor:pointer;user-select:none}
thead th:hover{background:var(--darkgray)}
.si{margin-left:3px;font-size:9px;opacity:.7}
tbody tr:nth-child(even){background:#f7f9fd}
tbody tr:hover{background:#fffbe6}
tbody td{padding:6px 9px;border-bottom:1px solid var(--border);vertical-align:middle}
.tdt{max-width:310px;word-break:break-word;line-height:1.3}
.tdl a{color:var(--black);text-decoration:none;font-weight:600;padding:2px 7px;border:1px solid var(--black);border-radius:4px;white-space:nowrap;font-size:11px}
.tdl a:hover{background:var(--black);color:var(--gold)}
tfoot td{padding:6px 9px;color:var(--muted);font-size:11px;border-top:2px solid var(--border);font-weight:600}
.sb{padding:4px 11px;font-size:10px;color:var(--muted);border-top:1px solid var(--border)}
@media(max-width:900px){.fgrid{grid-template-columns:1fr 1fr}.top{flex-direction:column}.scol{flex-direction:row;flex-wrap:wrap}.sc{flex:1;min-width:110px}}
</style>
</head>

// Process raw data
let ALL=RAW.map(r=>{
  const p=r.d.split('/');
  const mo=+p[0]||0,dy=+p[1]||0,yr=+p[2]||0;
  const q=mo<=3?1:mo<=6?2:mo<=9?3:4;
  return{...r,mo,dy,yr,q,mn:MN[mo]||'',url:BASE+r.f,_s:yr*10000+mo*100+dy};
});

let sCol='_s',sDir='desc';

// Filters
function uniq(a){return[...new Set(a.filter(Boolean))]}
function fill(id,vals,g){
  document.getElementById(id).innerHTML=vals.map(v=>`<label><input type="checkbox" data-g="${g}" value="${x(String(v))}" onchange="rdr()">${x(String(v))}</label>`).join('');
}
function buildF(){
  fill('fB',uniq(ALL.map(r=>r.b)).sort(),'b');
  fill('fH',uniq(ALL.map(r=>r.h)).sort(),'h');
  fill('fR',uniq(ALL.map(r=>r.rt)).sort(),'r');
  fill('fY',uniq(ALL.map(r=>r.yr)).sort((a,b)=>b-a),'y');
}
function gsel(g){return[...document.querySelectorAll(`[data-g="${g}"]:checked`)].map(c=>c.value)}
function applyF(){
  const b=gsel('b'),h=gsel('h'),r=gsel('r'),y=gsel('y').map(Number);
  return ALL.filter(rec=>
    (!b.length||b.includes(rec.b))&&
    (!h.length||h.includes(rec.h))&&
    (!r.length||r.includes(rec.rt))&&
    (!y.length||y.includes(rec.yr))
  );
}
function clr(){document.querySelectorAll('[data-g]').forEach(c=>c.checked=false);rdr()}

// Sort
function sb(col){
  if(sCol===col)sDir=sDir==='asc'?'desc':'asc';
  else{sCol=col;sDir=col==='_s'?'desc':'asc';}
  rdr();
}
function srt(recs){
  const d=sDir==='asc'?1:-1;
  return[...recs].sort((a,b)=>{
    const av=a[sCol]??'',bv=b[sCol]??'';
    return typeof av==='number'?(av-bv)*d:String(av).localeCompare(String(bv))*d;
  });
}
function updIcons(){
  ['t','_s','q','mn','dy','h','rt','v'].forEach(c=>{
    const el=document.getElementById('si-'+c);
    if(el)el.textContent=c===sCol?(sDir==='asc'?'▲':'▼'):'⇅';
  });
}

// Render
function rdr(){
  const f=applyF(),rows=srt(f);
  document.getElementById('tB').innerHTML=rows.map(r=>`<tr>
    <td class="tdt">${x(r.t)}</td>
    <td>${r.yr||''}</td>
    <td>Qtr ${r.q}</td>
    <td>${r.mn}</td>
    <td>${r.dy||''}</td>
    <td>${x(r.h)}</td>
    <td>${x(r.rt)}</td>
    <td>${x(r.v)}</td>
    <td class="tdl"><a href="${x(r.url)}" target="_blank" rel="noopener">Open ↗</a></td>
  </tr>`).join('');
  document.getElementById('tF').textContent=`Total  ${rows.length} record${rows.length!==1?'s':''}`;
  document.getElementById('sC').textContent=f.length;
  const lat=f.reduce((a,b)=>(!a||b._s>a._s)?b:a,null);
  document.getElementById('sL').textContent=lat?`${lat.mo}/${lat.dy}/${lat.yr}`:'—';
  updIcons();
}

function x(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

buildF();
rdr();
